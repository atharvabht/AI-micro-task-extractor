<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">
    <header>
      <h1>Task <span>Extractor</span></h1>
      <div id="taskStats">0 tasks remaining</div>
    </header>

    <main>
      <div id="tasksContainer">
        <ul id="tasks"></ul>
      </div>

      <div id="statusMessage" class="status-message"></div>

      <div class="api-management">
        <div class="api-input-wrapper">
          <input id="hfApiKey" type="password" placeholder="Hugging Face API Key" />
          <button id="saveKeyBtn" title="Save Key">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
          </button>
        </div>
        <p class="api-hint">Keys are stored locally on your device.</p>
      </div>

      <div class="action-area">
        <div class="input-section">
          <input id="manualTask" type="text" placeholder="Add a task..." />
          <button id="addTask" title="Add task (Enter)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
        </div>

        <button id="extract" class="primary-btn">
          <span class="btn-text">Extract from Page</span>
          <span class="btn-subtext">Shortcut: Ctrl+E</span>
          <div class="loader" id="extractionLoader" style="display: none;"></div>
        </button>
      </div>
    </main>

    <div id="toast" class="toast">
      <span id="toastMsg">Task deleted</span>
      <button id="undoBtn">Undo</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
